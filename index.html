<!-- =====================================================
     CORREÇÃO — ENCAMINHAMENTO COMPLETO PELO WHATSAPP
     Inclui corretamente Bloco + Andar/Pavimento
===================================================== -->

<script id="encaminhamentoWhatsAppAdminV60">
(function () {
    "use strict";


    /* =====================================================
       BUSCAR VALOR DO CHAMADO
    ===================================================== */

    function valorCampoEncaminhamento(
        chamado,
        nomes,
        padrao
    ) {

        if (!chamado) {
            return padrao || "";
        }


        for (
            var i = 0;
            i < nomes.length;
            i++
        ) {

            var nome =
                nomes[i];


            var valor =
                chamado[nome];


            if (
                valor !== undefined &&
                valor !== null &&
                String(valor).trim() !== ""
            ) {

                return String(
                    valor
                ).trim();

            }

        }


        return padrao || "";

    }



    /* =====================================================
       LOCALIZAR O CHAMADO ATUALMENTE ABERTO
    ===================================================== */

    function obterChamadoSelecionadoEncaminhamento() {

        var listaAtivos =
            (
                typeof chamados !== "undefined" &&
                Array.isArray(chamados)
            )
                ? chamados
                : [];


        var listaArquivados =
            (
                typeof chamadosArquivadosV11 !==
                "undefined" &&
                Array.isArray(
                    chamadosArquivadosV11
                )
            )
                ? chamadosArquivadosV11
                : [];


        var protocoloAtual =
            (
                typeof protocoloSelecionado !==
                "undefined"
            )
                ? protocoloSelecionado
                : "";


        var chamadoAtivo =
            listaAtivos.find(
                function (item) {

                    return (
                        String(
                            item.protocolo || ""
                        ).trim()
                        ===
                        String(
                            protocoloAtual || ""
                        ).trim()
                    );

                }
            );


        if (chamadoAtivo) {

            return chamadoAtivo;

        }


        var chamadoArquivado =
            listaArquivados.find(
                function (item) {

                    return (
                        String(
                            item.protocolo || ""
                        ).trim()
                        ===
                        String(
                            protocoloAtual || ""
                        ).trim()
                    );

                }
            );


        if (chamadoArquivado) {

            return chamadoArquivado;

        }


        return null;

    }



    /* =====================================================
       MONTAR MENSAGEM COMPLETA
    ===================================================== */

    function montarMensagemEncaminhamento(
        chamado
    ) {

        var protocolo =
            valorCampoEncaminhamento(
                chamado,
                [
                    "protocolo",
                    "numeroProtocolo"
                ],
                (
                    typeof protocoloSelecionado !==
                    "undefined"
                )
                    ? protocoloSelecionado
                    : "Não informado"
            );


        var status =
            valorCampoEncaminhamento(
                chamado,
                [
                    "status"
                ],
                "Não informado"
            );


        var solicitante =
            valorCampoEncaminhamento(
                chamado,
                [
                    "solicitante",
                    "nome",
                    "nomeSolicitante"
                ],
                "Não informado"
            );


        var cargo =
            valorCampoEncaminhamento(
                chamado,
                [
                    "cargo",
                    "funcao",
                    "cargoFuncao"
                ],
                "Não informado"
            );


        var local =
            valorCampoEncaminhamento(
                chamado,
                [
                    "bloco",
                    "local",
                    "area",
                    "areaBloco",
                    "area_bloco"
                ],
                "Não informado"
            );


        /* =================================================
           CORREÇÃO PRINCIPAL

           O sistema salva o campo como:

           pavimentos

           Por isso ele aparece PRIMEIRO na lista.
        ================================================= */

        var pavimento =
            valorCampoEncaminhamento(
                chamado,
                [
                    "pavimentos",
                    "pavimento",
                    "andar",
                    "andares",
                    "andarPavimento",
                    "andar_pavimento"
                ],
                "Não informado"
            );


        var ocorrencia =
            valorCampoEncaminhamento(
                chamado,
                [
                    "ocorrencia",
                    "tipoOcorrencia",
                    "tipo_ocorrencia",
                    "categoriaEspecifica",
                    "ocorrenciaEspecifica"
                ],
                "Não informado"
            );


        var tipoGeral =
            valorCampoEncaminhamento(
                chamado,
                [
                    "tipoOcorrenciaGeral",
                    "categoriaGeral",
                    "tipoGeral"
                ],
                ""
            );


        var prioridadeCampo =
            document.getElementById(
                "prioridadeAdmin"
            );


        var prioridade =
            prioridadeCampo &&
            String(
                prioridadeCampo.value || ""
            ).trim()
                ? prioridadeCampo.value
                : valorCampoEncaminhamento(
                    chamado,
                    [
                        "prioridade"
                    ],
                    "Moderada"
                );


        var responsavelCampo =
            document.getElementById(
                "responsavelAdmin"
            );


        var responsavel =
            responsavelCampo &&
            String(
                responsavelCampo.value || ""
            ).trim()
                ? responsavelCampo.value.trim()
                : valorCampoEncaminhamento(
                    chamado,
                    [
                        "responsavel"
                    ],
                    "Não informado"
                );


        var detalhes =
            valorCampoEncaminhamento(
                chamado,
                [
                    "detalhes",
                    "descricao",
                    "relato",
                    "descricaoOcorrencia"
                ],
                "Não informado"
            );


        var dataOcorrencia =
            valorCampoEncaminhamento(
                chamado,
                [
                    "dataOcorrencia",
                    "data_ocorrencia",
                    "dataOcorrido",
                    "data_ocorrido",
                    "dataFato"
                ],
                ""
            );


        var horaInicial =
            valorCampoEncaminhamento(
                chamado,
                [
                    "horaInicial",
                    "hora_inicial",
                    "horaInicio",
                    "hora_inicio"
                ],
                ""
            );


        var horaFinal =
            valorCampoEncaminhamento(
                chamado,
                [
                    "horaFinal",
                    "hora_final",
                    "horaFim",
                    "hora_fim"
                ],
                ""
            );


        var dataAbertura =
            valorCampoEncaminhamento(
                chamado,
                [
                    "dataAbertura",
                    "data_abertura"
                ],
                ""
            );


        var horaAbertura =
            valorCampoEncaminhamento(
                chamado,
                [
                    "horaAbertura",
                    "hora_abertura"
                ],
                ""
            );


        var ultimaAtualizacao =
            valorCampoEncaminhamento(
                chamado,
                [
                    "ultimaAtualizacao",
                    "ultima_atualizacao"
                ],
                ""
            );


        var observacaoCampo =
            document.getElementById(
                "observacaoAdmin"
            );


        var observacao =
            observacaoCampo &&
            String(
                observacaoCampo.value || ""
            ).trim()
                ? observacaoCampo.value.trim()
                : valorCampoEncaminhamento(
                    chamado,
                    [
                        "observacaoSolucao",
                        "observacao_solucao",
                        "respostaAdministracao",
                        "resposta_administracao"
                    ],
                    ""
                );


        /* =================================================
           MONTAGEM DA MENSAGEM
        ================================================= */

        var linhas = [];


        linhas.push(
            "🏢 *PARQUE CLUBE*"
        );


        linhas.push(
            "📋 *ENCAMINHAMENTO DE CHAMADO*"
        );


        linhas.push(
            ""
        );


        linhas.push(
            "📄 *Protocolo:* " +
            protocolo
        );


        linhas.push(
            "📌 *Status:* " +
            status
        );


        linhas.push(
            "👤 *Solicitante:* " +
            solicitante
        );


        linhas.push(
            "💼 *Cargo/Função:* " +
            cargo
        );


        linhas.push(
            "📍 *Bloco / Local:* " +
            local
        );


        /* =================================================
           PAVIMENTO — SEMPRE ENVIADO
        ================================================= */

        linhas.push(
            "🏢 *Andar / Pavimento:* " +
            pavimento
        );


        if (
            tipoGeral &&
            String(tipoGeral).trim() !== ""
        ) {

            linhas.push(
                "📂 *Tipo geral:* " +
                tipoGeral
            );

        }


        linhas.push(
            "🔧 *Ocorrência:* " +
            ocorrencia
        );


        linhas.push(
            "⭐ *Prioridade:* " +
            prioridade
        );


        if (
            dataOcorrencia
        ) {

            linhas.push(
                "📅 *Data do ocorrido:* " +
                dataOcorrencia
            );

        }


        if (
            horaInicial
        ) {

            linhas.push(
                "🕒 *Hora inicial:* " +
                horaInicial
            );

        }


        if (
            horaFinal
        ) {

            linhas.push(
                "🕒 *Hora final:* " +
                horaFinal
            );

        }


        if (
            dataAbertura
        ) {

            var recebidoEm =
                dataAbertura;


            if (
                horaAbertura
            ) {

                recebidoEm +=
                    " às " +
                    horaAbertura;

            }


            linhas.push(
                "📥 *Recebido em:* " +
                recebidoEm
            );

        }


        if (
            ultimaAtualizacao
        ) {

            linhas.push(
                "🔄 *Última atualização:* " +
                ultimaAtualizacao
            );

        }


        linhas.push(
            ""
        );


        linhas.push(
            "📝 *Detalhes do chamado:*"
        );


        linhas.push(
            detalhes
        );


        linhas.push(
            ""
        );


        linhas.push(
            "👤 *Responsável:* " +
            responsavel
        );


        if (
            observacao &&
            String(
                observacao
            ).trim() !== ""
        ) {

            linhas.push(
                ""
            );


            linhas.push(
                "✅ *Observação da Administração:*"
            );


            linhas.push(
                observacao
            );

        }


        linhas.push(
            ""
        );


        linhas.push(
            "━━━━━━━━━━━━━━━━━━"
        );


        linhas.push(
            "Sistema de Gestão do Condomínio"
        );


        linhas.push(
            "PARQUE CLUBE"
        );


        return linhas.join(
            "\n"
        );

    }



    /* =====================================================
       ABRIR WHATSAPP
    ===================================================== */

    function abrirEncaminhamentoWhatsApp() {

        var input =
            document.getElementById(
                "whatsappDestinoAdmin"
            );


        if (!input) {

            alert(
                "Campo de WhatsApp de destino não encontrado."
            );

            return;

        }


        var bruto =
            String(
                input.value || ""
            ).trim();


        var numero =
            bruto.replace(
                /\D/g,
                ""
            );


        if (
            !numero
        ) {

            alert(
                "Informe o número do WhatsApp de destino."
            );

            input.focus();

            return;

        }


        /*
         * Se tiver número brasileiro sem o código do país,
         * acrescenta 55.
         */

        if (
            numero.length === 10 ||
            numero.length === 11
        ) {

            numero =
                "55" +
                numero;

        }


        if (
            numero.length < 12
        ) {

            alert(
                "Informe um número de WhatsApp válido."
            );

            input.focus();

            return;

        }


        var chamado =
            obterChamadoSelecionadoEncaminhamento();


        if (
            !chamado
        ) {

            alert(
                "Nenhum chamado foi selecionado. Abra um chamado antes de encaminhá-lo."
            );

            return;

        }


        try {

            localStorage.setItem(
                "parqueClubeWhatsappDestinoAdmin",
                bruto
            );

        } catch (
            erro
        ) {

            console.warn(
                "Não foi possível salvar o número informado.",
                erro
            );

        }


        var mensagem =
            montarMensagemEncaminhamento(
                chamado
            );


        var url =
            "https://wa.me/" +
            numero +
            "?text=" +
            encodeURIComponent(
                mensagem
            );


        window.open(
            url,
            "_blank",
            "noopener"
        );

    }



    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */

    function inicializarEncaminhamentoWhatsApp() {

        var input =
            document.getElementById(
                "whatsappDestinoAdmin"
            );


        var botao =
            document.getElementById(
                "btnEncaminharWhatsAppAdmin"
            );


        if (
            input
        ) {

            try {

                var salvo =
                    localStorage.getItem(
                        "parqueClubeWhatsappDestinoAdmin"
                    );


                if (
                    salvo &&
                    String(
                        salvo
                    ).trim()
                ) {

                    input.value =
                        salvo;

                }

            } catch (
                erro
            ) {

                console.warn(
                    "Não foi possível recuperar o número salvo.",
                    erro
                );

            }

        }


        if (
            botao
        ) {

            /*
             * Remove possíveis eventos anteriores
             * que possam estar deixando o botão travado.
             */

            botao.onclick =
                abrirEncaminhamentoWhatsApp;


            botao.addEventListener(
                "click",
                function (
                    evento
                ) {

                    evento.preventDefault();

                },
                false
            );

        }

    }



    /* =====================================================
       DISPONIBILIZAR FUNÇÕES
    ===================================================== */

    window.montarMensagemEncaminhamento =
        montarMensagemEncaminhamento;


    window.abrirEncaminhamentoWhatsApp =
        abrirEncaminhamentoWhatsApp;


    /* =====================================================
       CARREGAMENTO
    ===================================================== */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            inicializarEncaminhamentoWhatsApp
        );

    } else {

        inicializarEncaminhamentoWhatsApp();

    }

})();
</script>
