<script id="encaminhamentoWhatsAppAdminV61">
(function () {
    "use strict";

    function valor(chamado, campos, padrao) {
        if (!chamado) return padrao || "";

        for (var i = 0; i < campos.length; i++) {
            var v = chamado[campos[i]];

            if (
                v !== undefined &&
                v !== null &&
                String(v).trim() !== ""
            ) {
                return String(v).trim();
            }
        }

        return padrao || "";
    }

    function obterChamadoAtual() {
        var protocolo = String(
            window.protocoloSelecionado || ""
        ).trim();

        if (!protocolo) return null;

        var ativos = Array.isArray(window.chamados)
            ? window.chamados
            : [];

        var arquivados = Array.isArray(
            window.chamadosArquivadosV11
        )
            ? window.chamadosArquivadosV11
            : [];

        var todos = ativos.concat(arquivados);

        return todos.find(function (item) {
            return String(
                item.protocolo || ""
            ).trim() === protocolo;
        }) || null;
    }

    function montarMensagemEncaminhamento(chamado) {

        var protocolo = valor(
            chamado,
            ["protocolo"],
            String(window.protocoloSelecionado || "")
        );

        var status = valor(
            chamado,
            ["status"],
            "Não informado"
        );

        var solicitante = valor(
            chamado,
            ["solicitante", "nome"],
            "Não informado"
        );

        var cargo = valor(
            chamado,
            ["cargo", "funcao"],
            "Não informado"
        );

        var bloco = valor(
            chamado,
            ["bloco", "local", "areaBloco"],
            "Não informado"
        );

        /* CORREÇÃO DO PAVIMENTO */
        var pavimentos = valor(
            chamado,
            [
                "pavimentos",
                "pavimento",
                "andar",
                "andares",
                "andarPavimento"
            ],
            "Não informado"
        );

        var ocorrencia = valor(
            chamado,
            [
                "ocorrencia",
                "tipoOcorrencia",
                "tipo_ocorrencia"
            ],
            "Não informado"
        );

        var prioridade = valor(
            chamado,
            ["prioridade"],
            "Moderada"
        );

        var detalhes = valor(
            chamado,
            ["detalhes", "descricao", "relato"],
            "Não informado"
        );

        var dataOcorrencia = valor(
            chamado,
            ["dataOcorrencia", "data_ocorrencia"],
            ""
        );

        var horaInicial = valor(
            chamado,
            ["horaInicial", "hora_inicial"],
            ""
        );

        var horaFinal = valor(
            chamado,
            ["horaFinal", "hora_final"],
            ""
        );

        var dataAbertura = valor(
            chamado,
            ["dataAbertura", "data_abertura"],
            ""
        );

        var horaAbertura = valor(
            chamado,
            ["horaAbertura", "hora_abertura"],
            ""
        );

        var responsavelInput =
            document.getElementById("responsavelAdmin");

        var responsavel =
            responsavelInput &&
            responsavelInput.value.trim()
                ? responsavelInput.value.trim()
                : valor(
                    chamado,
                    ["responsavel"],
                    "Não informado"
                );

        var observacaoInput =
            document.getElementById("observacaoAdmin");

        var observacao =
            observacaoInput &&
            observacaoInput.value.trim()
                ? observacaoInput.value.trim()
                : valor(
                    chamado,
                    [
                        "observacaoSolucao",
                        "observacao_solucao",
                        "respostaAdministracao"
                    ],
                    ""
                );

        var mensagem = [];

        mensagem.push(
            "🏢 *PARQUE CLUBE*"
        );

        mensagem.push(
            "📋 *ENCAMINHAMENTO DE CHAMADO*"
        );

        mensagem.push("");

        mensagem.push(
            "📄 *Protocolo:* " + protocolo
        );

        mensagem.push(
            "📌 *Status:* " + status
        );

        mensagem.push(
            "👤 *Solicitante:* " + solicitante
        );

        mensagem.push(
            "💼 *Cargo/Função:* " + cargo
        );

        mensagem.push(
            "📍 *Bloco / Local:* " + bloco
        );

        mensagem.push(
            "🏢 *Andar / Pavimento:* " + pavimentos
        );

        mensagem.push(
            "🔧 *Ocorrência:* " + ocorrencia
        );

        mensagem.push(
            "⭐ *Prioridade:* " + prioridade
        );

        if (dataOcorrencia) {
            mensagem.push(
                "📅 *Data da ocorrência:* " +
                dataOcorrencia
            );
        }

        if (horaInicial) {
            mensagem.push(
                "🕒 *Hora inicial:* " +
                horaInicial
            );
        }

        if (horaFinal) {
            mensagem.push(
                "🕒 *Hora final:* " +
                horaFinal
            );
        }

        if (dataAbertura) {

            var recebido =
                dataAbertura;

            if (horaAbertura) {
                recebido +=
                    " às " +
                    horaAbertura;
            }

            mensagem.push(
                "📥 *Recebido em:* " +
                recebido
            );
        }

        mensagem.push("");

        mensagem.push(
            "📝 *Detalhes do chamado:*"
        );

        mensagem.push(
            detalhes
        );

        mensagem.push("");

        mensagem.push(
            "👤 *Responsável:* " +
            responsavel
        );

        if (observacao) {

            mensagem.push("");

            mensagem.push(
                "✅ *Observação da Administração:*"
            );

            mensagem.push(
                observacao
            );
        }

        mensagem.push("");

        mensagem.push(
            "━━━━━━━━━━━━━━━━━━"
        );

        mensagem.push(
            "🏢 PARQUE CLUBE"
        );

        mensagem.push(
            "Sistema de Gestão do Condomínio"
        );

        return mensagem.join("\n");
    }

    function encaminharWhatsApp() {

        var input = document.getElementById(
            "whatsappDestinoAdmin"
        );

        if (!input) {
            alert(
                "Campo do WhatsApp de destino não encontrado."
            );
            return;
        }

        var numero = String(
            input.value || ""
        ).replace(/\D/g, "");

        if (!numero) {
            alert(
                "Informe o número do WhatsApp de destino."
            );
            input.focus();
            return;
        }

        /* Número brasileiro sem DDI */
        if (
            numero.length === 10 ||
            numero.length === 11
        ) {
            numero = "55" + numero;
        }

        var chamado =
            obterChamadoAtual();

        if (!chamado) {
            alert(
                "Nenhum chamado está aberto para encaminhamento."
            );
            return;
        }

        try {
            localStorage.setItem(
                "parqueClubeWhatsappDestinoAdmin",
                input.value
            );
        } catch (erro) {
            console.warn(erro);
        }

        var mensagem =
            montarMensagemEncaminhamento(
                chamado
            );

        var url =
            "https://wa.me/" +
            numero +
            "?text=" +
            encodeURIComponent(mensagem);

        window.open(
            url,
            "_blank",
            "noopener"
        );
    }

    function iniciar() {

        var input =
            document.getElementById(
                "whatsappDestinoAdmin"
            );

        var botao =
            document.getElementById(
                "btnEncaminharWhatsAppAdmin"
            );

        if (input) {

            try {

                var salvo =
                    localStorage.getItem(
                        "parqueClubeWhatsappDestinoAdmin"
                    );

                if (salvo) {
                    input.value = salvo;
                }

            } catch (erro) {
                console.warn(erro);
            }
        }

        if (botao) {

            /* Remove comportamento anterior */
            botao.onclick = null;

            botao.onclick =
                function (evento) {

                    evento.preventDefault();

                    encaminharWhatsApp();

                    return false;
                };
        }
    }

    window.montarMensagemEncaminhamento =
        montarMensagemEncaminhamento;

    window.encaminharWhatsAppAdmin =
        encaminharWhatsApp;

    if (
        document.readyState === "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            iniciar
        );

    } else {

        iniciar();
    }

})();
</script>
