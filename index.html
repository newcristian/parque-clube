<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#17632d"
>

<title>Chamados - Parque Clube</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {

    background:
        linear-gradient(
            135deg,
            #eef5ef,
            #ffffff
        );

    min-height: 100vh;

    padding: 15px;

    color: #222;
}

.container {

    width: 100%;

    max-width: 570px;

    margin: auto;

    background: #fff;

    border-radius: 18px;

    padding: 20px;

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.12);
}

.logo {

    text-align: center;

    margin-bottom: 10px;
}

.logo img {

    width: 230px;

    max-width: 80%;

    height: auto;
}

h1 {

    text-align: center;

    color: #17632d;

    font-size: 23px;

    margin-bottom: 5px;
}

.subtitle {

    text-align: center;

    color: #777;

    font-size: 13px;

    margin-bottom: 20px;
}


/* MENU */

.menu {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-bottom: 20px;
}

.menu button {

    margin: 0;

    font-size: 14px;

    padding: 12px 7px;
}


/* SEÇÕES */

.section {

    display: none;
}

.section.active {

    display: block;
}

.section-title {

    color: #17632d;

    font-weight: bold;

    font-size: 19px;

    border-bottom:
        2px solid #e5e5e5;

    padding-bottom: 8px;

    margin-bottom: 17px;
}


/* CAMPOS */

.form-group {

    margin-bottom: 14px;
}

label {

    display: block;

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 5px;

    color: #333;
}

input,
select,
textarea {

    width: 100%;

    border:
        1px solid #cfcfcf;

    border-radius: 8px;

    padding: 11px;

    font-size: 15px;

    background: #fff;
}

input:focus,
select:focus,
textarea:focus {

    outline: none;

    border-color:
        #17632d;

    box-shadow:
        0 0 0 2px
        rgba(23,99,45,.12);
}

textarea {

    min-height: 100px;

    resize: vertical;
}

input[readonly] {

    background: #f2f2f2;

    font-weight: bold;
}


/* BOTÕES */

button {

    width: 100%;

    border: none;

    border-radius: 8px;

    padding: 13px;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 7px;
}

button:disabled {

    opacity: .6;

    cursor: not-allowed;
}

.btn-verde {

    background: #17632d;
}

.btn-cinza {

    background: #666;
}

.btn-whatsapp {

    background: #20c863;
}

.btn-azul {

    background: #1769aa;
}

.btn-vermelho {

    background: #b42318;
}


/* PAVIMENTOS */

#areaPavimentos {

    display: none;
}

.pavimentos {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;
}

.pavimento {

    display: flex;

    align-items: center;

    gap: 5px;

    background: #f8f8f8;

    border:
        1px solid #ddd;

    border-radius: 7px;

    padding: 8px;

    font-size: 12px;

    font-weight: normal;
}

.pavimento input {

    width: auto;
}


/* CAMERA */

#areaCamera,
#areaFoto {

    display: none;
}

.foto-box {

    border:
        2px dashed #aaa;

    border-radius: 10px;

    padding: 15px;

    text-align: center;

    background: #fafafa;
}

.foto-box small {

    display: block;

    color: #777;

    margin-top: 5px;
}

#previewFoto {

    display: none;

    width: 100%;

    max-height: 280px;

    object-fit: contain;

    margin-top: 12px;

    border-radius: 10px;
}


/* MENSAGENS */

.mensagem {

    display: none;

    margin-top: 15px;

    padding: 12px;

    border-radius: 8px;

    text-align: center;

    font-size: 14px;

    font-weight: bold;
}

.sucesso {

    background: #d9f3df;

    color: #17632d;

    border:
        1px solid #a8d8b2;
}

.erro {

    background: #f8d7da;

    color: #721c24;

    border:
        1px solid #f5c6cb;
}


/* PROTOCOLO */

.protocolo-box {

    display: none;

    margin-top: 18px;

    background: #f0f8f2;

    border:
        2px solid #17632d;

    border-radius: 12px;

    padding: 17px;

    text-align: center;
}

.protocolo-titulo {

    font-size: 13px;

    color: #555;

    margin-bottom: 5px;
}

.protocolo-numero {

    font-size: 25px;

    color: #17632d;

    font-weight: bold;

    margin-bottom: 10px;
}


/* CONSULTA */

.resultado {

    display: none;

    margin-top: 18px;

    border:
        1px solid #ddd;

    border-radius: 10px;

    overflow: hidden;
}

.resultado-header {

    background: #17632d;

    color: white;

    padding: 14px;

    text-align: center;

    font-weight: bold;
}

.resultado-body {

    padding: 15px;
}

.resultado-item {

    padding: 9px 0;

    border-bottom:
        1px solid #eee;

    font-size: 14px;

    line-height: 1.4;
}

.resultado-item:last-child {

    border-bottom: none;
}

.resultado-item strong {

    display: block;

    color: #555;

    margin-bottom: 3px;
}


/* STATUS */

.status {

    display: inline-block;

    padding: 6px 12px;

    border-radius: 20px;

    font-weight: bold;
}

.status-aberto {

    background: #fff3cd;

    color: #856404;
}

.status-andamento {

    background: #cfe8ff;

    color: #075985;
}

.status-resolvido {

    background: #d9f3df;

    color: #17632d;
}

.status-cancelado {

    background: #f8d7da;

    color: #721c24;
}


/* ADMIN */

.admin-box {

    background: #f7f7f7;

    border:
        1px solid #ddd;

    border-radius: 12px;

    padding: 15px;

    margin-top: 15px;
}

.admin-titulo {

    font-size: 16px;

    color: #17632d;

    font-weight: bold;

    margin-bottom: 12px;
}

.admin-conteudo {

    display: none;
}


/* RESPONSIVO */

@media (max-width: 430px) {

    .container {

        padding: 16px;
    }

    .menu {

        grid-template-columns:
            1fr;
    }

    .pavimentos {

        grid-template-columns:
            repeat(2, 1fr);
    }
}

</style>

</head>

<script>


/* =====================================================
   CONFIGURAÇÕES
===================================================== */

const API_ENDPOINT =
    "/.netlify/functions/protocolo";


const FORM_ENDPOINT =
    "https://formspree.io/f/mljrnqgv";


const WHATSAPP_NUMERO =
    "5561986038106";


let adminSenhaTemporaria = "";

let protocoloAdminAtual = "";

let chamadoAdminAtual = null;


/* =====================================================
   SEÇÕES
===================================================== */

function abrirSecao(secao) {

    document
        .getElementById("secaoAbrir")
        .classList.remove("active");

    document
        .getElementById("secaoConsultar")
        .classList.remove("active");

    document
        .getElementById("secaoAdmin")
        .classList.remove("active");


    if (secao === "abrir") {

        document
            .getElementById("secaoAbrir")
            .classList.add("active");

    }


    if (secao === "consultar") {

        document
            .getElementById("secaoConsultar")
            .classList.add("active");

    }


    if (secao === "admin") {

        document
            .getElementById("secaoAdmin")
            .classList.add("active");

    }


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =====================================================
   PAVIMENTOS
===================================================== */

const bloco =
    document.getElementById("bloco");

const areaPavimentos =
    document.getElementById("areaPavimentos");

const todosPavimentos =
    document.getElementById("todosPavimentos");


bloco.addEventListener(
    "change",
    function() {

        if (
            this.value.startsWith("Bloco ")
        ) {

            areaPavimentos.style.display =
                "block";

        }

        else {

            areaPavimentos.style.display =
                "none";

            document
                .querySelectorAll(
                    'input[name="pavimento"]'
                )
                .forEach(
                    item => {

                        item.checked =
                            false;

                        item.disabled =
                            false;

                    }
                );

        }

    }
);


todosPavimentos.addEventListener(
    "change",
    function() {

        document
            .querySelectorAll(
                'input[name="pavimento"]'
            )
            .forEach(
                item => {

                    if (
                        item !==
                        todosPavimentos
                    ) {

                        item.disabled =
                            todosPavimentos.checked;

                        if (
                            todosPavimentos.checked
                        ) {

                            item.checked =
                                false;

                        }

                    }

                }
            );

    }
);


/* =====================================================
   OCORRÊNCIA
===================================================== */

const ocorrencia =
    document.getElementById("ocorrencia");

const areaCamera =
    document.getElementById("areaCamera");

const areaFoto =
    document.getElementById("areaFoto");


ocorrencia.addEventListener(
    "change",
    function() {

        const camera =
            this.value ===
            "Imagem/câmera";


        areaCamera.style.display =
            camera
                ? "block"
                : "none";


        areaFoto.style.display =
            camera
                ? "block"
                : "none";


        document
            .getElementById("dataOcorrencia")
            .required =
            camera;


        document
            .getElementById("horaInicial")
            .required =
            camera;


        document
            .getElementById("horaFinal")
            .required =
            camera;

    }
);


/* =====================================================
   FOTO
===================================================== */

document
    .getElementById("foto")
    .addEventListener(
        "change",
        function() {

            const arquivo =
                this.files[0];

            const preview =
                document.getElementById(
                    "previewFoto"
                );


            if (!arquivo) {

                preview.style.display =
                    "none";

                return;

            }


            const leitor =
                new FileReader();


            leitor.onload =
                function(evento) {

                    preview.src =
                        evento.target.result;

                    preview.style.display =
                        "block";

                };


            leitor.readAsDataURL(
                arquivo
            );

        }
    );


/* =====================================================
   PAVIMENTOS SELECIONADOS
===================================================== */

function obterPavimentos() {

    return Array
        .from(
            document.querySelectorAll(
                'input[name="pavimento"]:checked'
            )
        )
        .map(
            item =>
                item.value
        )
        .join(", ");

}


/* =====================================================
   DATA
===================================================== */

function formatarData(data) {

    if (!data)
        return "";

    const p =
        data.split("-");

    return (
        p[2] +
        "/" +
        p[1] +
        "/" +
        p[0]
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(texto) {

    return String(texto ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   ENVIO DO CHAMADO
===================================================== */

document
    .getElementById("formChamado")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const btn =
                document.getElementById(
                    "btnEnviar"
                );


            const erro =
                document.getElementById(
                    "mensagemErro"
                );


            const sucesso =
                document.getElementById(
                    "mensagemSucesso"
                );


            erro.style.display =
                "none";

            sucesso.style.display =
                "none";


            btn.disabled =
                true;

            btn.textContent =
                "⏳ Gerando protocolo...";


            try {

                const dados = {

                    solicitante:
                        document
                            .getElementById(
                                "solicitante"
                            )
                            .value
                            .trim(),

                    cargo:
                        document
                            .getElementById(
                                "cargo"
                            )
                            .value,

                    bloco:
                        bloco.value,

                    pavimentos:
                        obterPavimentos(),

                    ocorrencia:
                        ocorrencia.value,

                    dataOcorrencia:
                        formatarData(
                            document
                                .getElementById(
                                    "dataOcorrencia"
                                )
                                .value
                        ),

                    horaInicial:
                        document
                            .getElementById(
                                "horaInicial"
                            )
                            .value,

                    horaFinal:
                        document
                            .getElementById(
                                "horaFinal"
                            )
                            .value,

                    detalhes:
                        document
                            .getElementById(
                                "detalhes"
                            )
                            .value
                            .trim()

                };


                /* GERAR PROTOCOLO */

                const resposta =
                    await fetch(
                        API_ENDPOINT,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify(
                                    dados
                                )

                        }
                    );


                const resultado =
                    await resposta.json();


                if (
                    !resposta.ok ||
                    !resultado.protocolo
                ) {

                    throw new Error(
                        resultado.erro ||
                        "Não foi possível gerar o protocolo."
                    );

                }


                const protocolo =
                    resultado.protocolo;


                /* MOSTRAR PROTOCOLO */

                document
                    .getElementById(
                        "protocolo"
                    )
                    .value =
                    protocolo;


                document
                    .getElementById(
                        "numeroProtocolo"
                    )
                    .textContent =
                    protocolo;


                document
                    .getElementById(
                        "protocoloBox"
                    )
                    .style.display =
                    "block";


                /* EMAIL */

                const formData =
                    new FormData();


                formData.append(
                    "Protocolo / OS",
                    protocolo
                );

                formData.append(
                    "Solicitante",
                    dados.solicitante
                );

                formData.append(
                    "Cargo/Função",
                    dados.cargo
                );

                formData.append(
                    "Bloco / Área",
                    dados.bloco
                );

                formData.append(
                    "Pavimento(s)",
                    dados.pavimentos ||
                    "Não informado"
                );

                formData.append(
                    "Tipo de Ocorrência",
                    dados.ocorrencia
                );

                formData.append(
                    "Data da ocorrência",
                    dados.dataOcorrencia
                );

                formData.append(
                    "Hora inicial",
                    dados.horaInicial
                );

                formData.append(
                    "Hora final",
                    dados.horaFinal
                );

                formData.append(
                    "Detalhes",
                    dados.detalhes
                );

                formData.append(
                    "_subject",
                    "Novo Chamado Parque Clube - " +
                    protocolo
                );


                const foto =
                    document.getElementById(
                        "foto"
                    );


                if (
                    foto.files.length
                ) {

                    formData.append(
                        "Foto",
                        foto.files[0]
                    );

                }


                try {

                    await fetch(
                        FORM_ENDPOINT,
                        {

                            method:
                                "POST",

                            body:
                                formData,

                            headers: {

                                "Accept":
                                    "application/json"

                            }

                        }
                    );

                }

                catch(emailErro) {

                    console.warn(
                        "Falha no envio do e-mail:",
                        emailErro
                    );

                }


                /* SUCESSO */

                sucesso.innerHTML =
                    "✅ Chamado registrado com sucesso!<br>" +
                    "<strong>Protocolo: " +
                    escapeHTML(
                        protocolo
                    ) +
                    "</strong>";


                sucesso.style.display =
                    "block";


                configurarWhatsApp(
                    protocolo,
                    dados
                );


                this.reset();


                areaPavimentos.style.display =
                    "none";


                areaCamera.style.display =
                    "none";


                areaFoto.style.display =
                    "none";


                document
                    .getElementById(
                        "previewFoto"
                    )
                    .style.display =
                    "none";


            }

            catch(error) {

                console.error(
                    error
                );


                erro.textContent =
                    error.message ||
                    "Não foi possível gerar o protocolo. Tente novamente.";


                erro.style.display =
                    "block";

            }


            finally {

                btn.disabled =
                    false;

                btn.textContent =
                    "📋 Enviar Chamado";

            }

        }
    );


/* =====================================================
   WHATSAPP
===================================================== */

function configurarWhatsApp(
    protocolo,
    dados
) {

    let mensagem =

        "🏢 *PARQUE CLUBE*\n" +
        "*NOVO CHAMADO / OS*\n\n" +

        "📋 *Protocolo:* " +
        protocolo +
        "\n\n" +

        "👤 *Solicitante:* " +
        dados.solicitante +
        "\n" +

        "💼 *Cargo/Função:* " +
        dados.cargo +
        "\n" +

        "📍 *Local:* " +
        dados.bloco +
        "\n";


    if (
        dados.pavimentos
    ) {

        mensagem +=
            "🏢 *Pavimento(s):* " +
            dados.pavimentos +
            "\n";

    }


    mensagem +=

        "🔧 *Ocorrência:* " +
        dados.ocorrencia +
        "\n";


    if (
        dados.dataOcorrencia
    ) {

        mensagem +=
            "📅 *Data:* " +
            dados.dataOcorrencia +
            "\n";

    }


    if (
        dados.horaInicial
    ) {

        mensagem +=
            "🕐 *Hora inicial:* " +
            dados.horaInicial +
            "\n";

    }


    if (
        dados.horaFinal
    ) {

        mensagem +=
            "🕐 *Hora final:* " +
            dados.horaFinal +
            "\n";

    }


    mensagem +=

        "\n📝 *Detalhes:*\n" +
        dados.detalhes +
        "\n\n" +

        "🟡 *Status: ABERTO*";


    document
        .getElementById(
            "btnWhatsApp"
        )
        .onclick =
        function() {

            const url =
                "https://wa.me/" +
                WHATSAPP_NUMERO +
                "?text=" +
                encodeURIComponent(
                    mensagem
                );


            window.open(
                url,
                "_blank"
            );

        };

}


/* =====================================================
   CONSULTAR PROTOCOLO

document
    .getElementById(
        "btnConsultar"
    )
    .addEventListener(
        "click",
        async function() {

            const protocolo =
                document
                    .getElementById(
                        "consultaProtocolo"
                    )
                    .value
                    .trim()
                    .toUpperCase();


            const mensagem =
                document
                    .getElementById(
                        "mensagemConsulta"
                    );


            mensagem.style.display =
                "none";


            if (!protocolo) {

                mensagem.textContent =
                    "Digite o número do protocolo.";

                mensagem.style.display =
                    "block";

                return;

            }


            this.disabled =
                true;

            this.textContent =
                "⏳ Consultando...";


            try {

                const resposta =
                    await fetch(

                        API_ENDPOINT +
                        "?protocolo=" +
                        encodeURIComponent(
                            protocolo
                        )

                    );


                const dados =
                    await resposta.json();


                if (
                    !resposta.ok ||
                    !dados.encontrado
                ) {

                    throw new Error(
                        dados.erro ||
                        "Protocolo não encontrado."
                    );

                }


                mostrarConsulta(
                    dados.chamado
                );

            }

            catch(error) {

                mensagem.textContent =
                    error.message;

                mensagem.style.display =
                    "block";

            }

            finally {

                this.disabled =
                    false;

                this.textContent =
                    "🔎 Consultar Protocolo";

            }

        }
    );


/* =====================================================
   MOSTRAR CONSULTA
===================================================== */

function classeStatus(
    status
) {

    if (
        status === "Resolvido"
    )
        return "status-resolvido";

    if (
        status === "Em andamento"
    )
        return "status-andamento";

    if (
        status === "Cancelado"
    )
        return "status-cancelado";

    return "status-aberto";

}


function mostrarConsulta(
    chamado
) {

    const resultado =
        document.getElementById(
            "resultadoConsulta"
        );


    const dados =
        document.getElementById(
            "dadosConsulta"
        );


    dados.innerHTML = `

        ${itemConsulta(
            "Protocolo / OS",
            chamado.protocolo
        )}

        ${itemConsulta(
            "Data de abertura",
            chamado.dataAbertura
        )}

        ${itemConsulta(
            "Solicitante",
            chamado.solicitante
        )}

        ${itemConsulta(
            "Cargo/Função",
            chamado.cargo
        )}

        ${itemConsulta(
            "Bloco / Área",
            chamado.bloco
        )}

        ${itemConsulta(
            "Pavimento(s)",
            chamado.pavimentos ||
            "Não informado"
        )}

        ${itemConsulta(
            "Tipo de Ocorrência",
            chamado.ocorrencia
        )}

        ${itemConsulta(
            "Detalhes",
            chamado.detalhes
        )}

        <div class="resultado-item">

            <strong>Status</strong>

            <span
                class="status ${
                    classeStatus(
                        chamado.status
                    )
                }"
            >

                ${escapeHTML(
                    chamado.status ||
                    "Aberto"
                )}

            </span>

        </div>

        ${
            chamado.dataConclusao
            ?
            itemConsulta(
                "Data da conclusão",
                chamado.dataConclusao
            )
            :
            ""
        }

        ${
            chamado.horaConclusao
            ?
            itemConsulta(
                "Hora da conclusão",
                chamado.horaConclusao
            )
            :
            ""
        }

        ${
            chamado.responsavel
            ?
            itemConsulta(
                "Responsável",
                chamado.responsavel
            )
            :
            ""
        }

        ${
            chamado.observacaoSolucao
            ?
            itemConsulta(
                "Observação da solução",
                chamado.observacaoSolucao
            )
            :
            ""
        }

    `;


    resultado.style.display =
        "block";

}


function itemConsulta(
    titulo,
    valor
) {

    return `

        <div class="resultado-item">

            <strong>
                ${escapeHTML(titulo)}
            </strong>

            <span>
                ${escapeHTML(
                    valor ||
                    "Não informado"
                )}
            </span>

        </div>

    `;

}

                    .getElementById(

                document
                    .getElementById(
                        "mensagemAdmin"
                    );

                mensagem.textContent =
                    "Digite a senha administrativa.";

                mensagem.style.display =
                    "block";

                return;

            /*
             * A senha fica apenas na memória
             * desta sessão do navegador.
             */

            adminSenhaTemporaria =
                senha;


            document
                .getElementById(
                    "adminConteudo"
                )
                .style.display =
                "block";


            mensagem.style.display =
                "none";


            this.textContent =
                "✅ Acesso liberado";


            this.disabled =
                true;

        }
    );

/* =====================================================
   ATUALIZAR CHAMADO
===================================================== */

document
    .getElementById(
        "btnAtualizar"
    )
    .addEventListener(
        "click",
        async function() {

            const mensagem =
                document
                    .getElementById(
                        "mensagemAtualizacao"
                    );


            mensagem.style.display =
                "none";


            if (
                !adminSenhaTemporaria
            ) {

                mensagem.textContent =
                    "Faça o login administrativo novamente.";

                mensagem.className =
                    "mensagem erro";

                mensagem.style.display =
                    "block";

                return;

            }


            const status =
                document
                    .getElementById(
                        "adminStatus"
                    )
                    .value;


            const responsavel =
                document
                    .getElementById(
                        "adminResponsavel"
                    )
                    .value
                    .trim();


            const observacaoSolucao =
                document
                    .getElementById(
                        "adminObservacao"
                    )
                    .value
                    .trim();


            this.disabled =
                true;

            this.textContent =
                "⏳ Salvando...";


            try {

                const resposta =
                    await fetch(
                        API_ENDPOINT,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    action:
                                        "update",

                                    protocolo:
                                        protocoloAdminAtual,

                                    adminPassword:
                                        adminSenhaTemporaria,

                                    status:
                                        status,

                                    responsavel:
                                        responsavel,

                                    observacaoSolucao:
                                        observacaoSolucao

                                })

                        }
                    );


                const dados =
                    await resposta.json();


                if (
                    !resposta.ok ||
                    !dados.sucesso
                ) {

                    throw new Error(
                        dados.erro ||
                        "Não foi possível atualizar o chamado."
                    );

                }


                chamadoAdminAtual =
                    dados.chamado;


                mensagem.textContent =
                    "✅ Chamado atualizado com sucesso.";


                mensagem.className =
                    "mensagem sucesso";


                mensagem.style.display =
                    "block";


                preencherAdmin(
                    dados.chamado
                );


            }

            catch(error) {

                mensagem.textContent =
                    error.message;


                mensagem.className =
                    "mensagem erro";


                mensagem.style.display =
                    "block";

            }

            finally {

                this.disabled =
                    false;

                this.textContent =
                    "💾 Atualizar Chamado";

            }

        }
    );
