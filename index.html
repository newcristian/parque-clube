<div id="adminConteudo" style="display:block;">

    <div class="admin-box">

        <div class="admin-titulo">
            📊 Painel de Chamados
        </div>

        <button
            type="button"
            id="btnListarProtocolos"
            class="btn-azul"
        >
            📋 Ver Todos os Protocolos
        </button>

        <div
            id="adminEstatisticas"
            style="display:none;"
        >

            <div class="stats">

                <div class="stat" style="background:#eee;">
                    <strong>Total</strong>
                    <span id="statTotal">0</span>
                </div>

                <div class="stat" style="background:#fff3cd;">
                    <strong>🟡 Abertos</strong>
                    <span id="statAbertos">0</span>
                </div>

                <div class="stat" style="background:#cfe8ff;">
                    <strong>🔵 Em andamento</strong>
                    <span id="statAndamento">0</span>
                </div>

                <div class="stat" style="background:#d9f3df;">
                    <strong>🟢 Resolvidos</strong>
                    <span id="statResolvidos">0</span>
                </div>

                <div class="stat" style="background:#f8d7da;">
                    <strong>🔴 Cancelados</strong>
                    <span id="statCancelados">0</span>
                </div>

            </div>

        </div>

        <div
            id="filtrosProtocolos"
            style="display:none;"
        >

            <div class="form-group">

                <label>
                    🔎 Pesquisar:
                </label>

                <input
                    type="text"
                    id="filtroPesquisa"
                    placeholder="Protocolo, nome, bloco ou ocorrência..."
                >

            </div>

            <div class="form-group">

                <label>
                    Status:
                </label>

                <select id="filtroStatus">

                    <option value="">
                        Todos os status
                    </option>

                    <option value="Aberto">
                        🟡 Aberto
                    </option>

                    <option value="Em andamento">
                        🔵 Em andamento
                    </option>

                    <option value="Resolvido">
                        🟢 Resolvido
                    </option>

                    <option value="Cancelado">
                        🔴 Cancelado
                    </option>

                </select>

            </div>

        </div>

        <div
            id="listaProtocolos"
            style="margin-top:15px;"
        ></div>

    </div>

</div>
