<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1d6b32"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <title>Chamados - Parque Clube</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {

            background:
                linear-gradient(
                    135deg,
                    #eef5ef,
                    #ffffff
                );

            min-height: 100vh;

            padding: 15px;

            color: #222;

        }


        .container {

            width: 100%;

            max-width: 570px;

            margin: 0 auto;

            background: #fff;

            border-radius: 18px;

            padding: 20px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,.12);

        }


        /* =================================================
           LOGO
        ================================================= */

        .logo {

            text-align: center;

            margin-bottom: 10px;

        }


        .logo img {

            width: 230px;

            max-width: 80%;

            height: auto;

        }


        h1 {

            text-align: center;

            color: #17632d;

            font-size: 23px;

            margin-bottom: 5px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 13px;

            margin-bottom: 20px;

        }


        /* =================================================
           MENU
        ================================================= */

        .menu {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-bottom: 20px;

        }


        .menu button {

            margin: 0;

            font-size: 14px;

            padding: 13px 8px;

        }


        .btn-primary {

            background: #17632d;

        }


        .btn-secondary {

            background: #555;

        }


        /* =================================================
           SEÇÕES
        ================================================= */

        .section {

            display: none;

        }


        .section.active {

            display: block;

        }


        .section-title {

            color: #17632d;

            font-weight: bold;

            font-size: 19px;

            border-bottom:
                2px solid #e5e5e5;

            padding-bottom: 8px;

            margin-bottom: 17px;

        }


        /* =================================================
           CAMPOS
        ================================================= */

        .form-group {

            margin-bottom: 14px;

        }


        label {

            display: block;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 5px;

            color: #333;

        }


        input,
        select,
        textarea {

            width: 100%;

            border:
                1px solid #cfcfcf;

            border-radius: 8px;

            padding: 11px;

            font-size: 15px;

            background: #fff;

        }


        input:focus,
        select:focus,
        textarea:focus {

            outline: none;

            border-color:
                #17632d;

            box-shadow:
                0 0 0 2px
                rgba(23,99,45,.12);

        }


        textarea {

            min-height: 100px;

            resize: vertical;

        }


        input[readonly] {

            background: #f2f2f2;

            font-weight: bold;

            color: #555;

        }


        /* =================================================
           PAVIMENTOS
        ================================================= */

        #areaPavimentos {

            display: none;

        }


        .pavimentos {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 7px;

            margin-top: 8px;

        }


        .pavimento {

            display: flex;

            align-items: center;

            gap: 5px;

            background: #f8f8f8;

            border:
                1px solid #ddd;

            border-radius: 7px;

            padding: 8px;

            font-size: 12px;

            font-weight: normal;

        }


        .pavimento input {

            width: auto;

        }


        /* =================================================
           CÂMERA / FOTO
        ================================================= */

        #areaCamera {

            display: none;

        }


        #areaFoto {

            display: none;

        }


        .foto-box {

            border:
                2px dashed #aaa;

            border-radius: 10px;

            padding: 15px;

            text-align: center;

            background: #fafafa;

        }


        .foto-box small {

            display: block;

            color: #777;

            margin-top: 5px;

        }


        #previewFoto {

            display: none;

            width: 100%;

            max-height: 280px;

            object-fit: contain;

            margin-top: 12px;

            border-radius: 10px;

        }


        /* =================================================
           BOTÕES
        ================================================= */

        button {

            width: 100%;

            border: none;

            border-radius: 8px;

            padding: 13px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 7px;

        }


        button:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        .btn-enviar {

            background: #17632d;

        }


        .btn-whatsapp {

            background: #20c863;

        }


        .btn-voltar {

            background: #777;

        }


        /* =================================================
           MENSAGENS
        ================================================= */

        .mensagem {

            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;

            font-weight: bold;

        }


        .sucesso {

            background: #d9f3df;

            color: #17632d;

            border:
                1px solid #a8d8b2;

        }


        .erro {

            background: #f8d7da;

            color: #721c24;

            border:
                1px solid #f5c6cb;

        }


        /* =================================================
           PROTOCOLO
        ================================================= */

        .protocolo-box {

            display: none;

            margin-top: 18px;

            background: #f0f8f2;

            border:
                2px solid #17632d;

            border-radius: 12px;

            padding: 17px;

            text-align: center;

        }


        .protocolo-titulo {

            font-size: 13px;

            color: #555;

            margin-bottom: 5px;

        }


        .protocolo-numero {

            font-size: 25px;

            color: #17632d;

            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 10px;

        }


        /* =================================================
           CONSULTA
        ================================================= */

        .resultado {

            display: none;

            margin-top: 18px;

            border:
                1px solid #ddd;

            border-radius: 10px;

            overflow: hidden;

        }


        .resultado-header {

            background: #17632d;

            color: white;

            padding: 14px;

            text-align: center;

            font-weight: bold;

        }


        .resultado-body {

            padding: 15px;

        }


        .resultado-item {

            padding: 9px 0;

            border-bottom:
                1px solid #eee;

            font-size: 14px;

            line-height: 1.4;

        }


        .resultado-item:last-child {

            border-bottom: none;

        }


        .resultado-item strong {

            display: block;

            color: #555;

            margin-bottom: 3px;

        }


        .status {

            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            background: #fff3cd;

            color: #856404;

            font-weight: bold;

        }


        /* =================================================
           RESPONSIVO
        ================================================= */

        @media (max-width: 430px) {

            .container {

                padding: 16px;

            }


            .menu {

                grid-template-columns:
                    1fr;

            }


            .pavimentos {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =================================================
         LOGO
    ================================================= -->

    <div class="logo">

        <img
            src="logo parqueclube.png"
            alt="Parque Clube"
        >

    </div>


    <h1>

        Abertura de Chamado Parque Clube

    </h1>


    <div class="subtitle">

        Sistema de Chamados / Ordem de Serviço

    </div>


    <!-- =================================================
         MENU
    ================================================= -->

    <div class="menu">

        <button
            type="button"
            class="btn-primary"
            onclick="abrirSecao('abrir')"
        >

            📋 Abrir Chamado

        </button>


        <button
            type="button"
            class="btn-secondary"
            onclick="abrirSecao('consultar')"
        >

            🔎 Consultar Protocolo

        </button>

    </div>


    <!-- =================================================
         ABRIR CHAMADO
    ================================================= -->

    <section
        id="secaoAbrir"
        class="section active"
    >

        <div class="section-title">

            📋 Abertura de Chamado / OS

        </div>


        <form
            id="formChamado"
            enctype="multipart/form-data"
        >


            <!-- =========================================
                 PROTOCOLO
            ========================================== -->

            <div class="form-group">

                <label>

                    Protocolo / OS:

                </label>

                <input
                    type="text"
                    id="protocolo"
                    value="Será gerado ao enviar"
                    readonly
                >

            </div>


            <!-- =========================================
                 SOLICITANTE
            ========================================== -->

            <div class="form-group">

                <label for="solicitante">

                    Seu Nome / Identificação:

                </label>

                <input
                    type="text"
                    id="solicitante"
                    required
                    placeholder="Digite seu nome"
                >

            </div>


            <!-- =========================================
                 CARGO
            ========================================== -->

            <div class="form-group">

                <label for="cargo">

                    Cargo/Função:

                </label>

                <select
                    id="cargo"
                    required
                >

                    <option value="">

                        Selecione o cargo/função

                    </option>

                    <option>
                        ASG (Auxiliar de Serviços Gerais)
                    </option>

                    <option>
                        Conselheiro(a)
                    </option>

                    <option>
                        Porteiro(a)
                    </option>

                    <option>
                        Síndica
                    </option>

                    <option>
                        Subsíndico(a)
                    </option>

                    <option>
                        Zelador(a)
                    </option>

                </select>

            </div>


            <!-- =========================================
                 BLOCO / ÁREA
            ========================================== -->

            <div class="form-group">

                <label for="bloco">

                    Bloco / Área:

                </label>

                <select
                    id="bloco"
                    required
                >

                    <option value="">

                        Selecione o local

                    </option>


                    <optgroup label="Blocos">

                        <option>Bloco 1A</option>
                        <option>Bloco 1B</option>
                        <option>Bloco 1C</option>
                        <option>Bloco 1D</option>
                        <option>Bloco 1E</option>

                        <option>Bloco 2A</option>
                        <option>Bloco 2B</option>
                        <option>Bloco 2C</option>
                        <option>Bloco 2D</option>
                        <option>Bloco 2E</option>

                    </optgroup>


                    <optgroup label="Áreas">

                        <option>Salão Sub1</option>
                        <option>Salão Sub2</option>

                        <option>Piscina Sub1</option>
                        <option>Piscina Sub2</option>

                        <option>Parquinho Sub1</option>
                        <option>Parquinho Sub2</option>

                    </optgroup>

                </select>

            </div>


            <!-- =========================================
                 PAVIMENTOS
            ========================================== -->

            <div
                id="areaPavimentos"
                class="form-group"
            >

                <label>

                    Pavimento(s):

                </label>


                <div class="pavimentos">


                    <label class="pavimento">

                        <input
                            type="checkbox"
                            name="pavimento"
                            value="Térreo"
                        >

                        Térreo

                    </label>


                    <label class="pavimento">

                        <input
                            type="checkbox"
                            name="pavimento"
                            value="1º andar"
                        >

                        1º andar

                    </label>


                    <label class="pavimento">

                        <input
                            type="checkbox"
                            name="pavimento"
                            value="2º andar"
                        >

                        2º andar

                    </label>


                    <label class="pavimento">

                        <input
                            type="checkbox"
                            name="pavimento"
                            value="3º andar"
                        >

                        3º andar

                    </label>


                    <label class="pavimento">

                        <input
                            type="checkbox"
                            name="pavimento"
                            value="4º andar"
                        >

                        4º andar

                    </label>


                    <label class="pavimento">

                        <input
                            type="checkbox"
                            name="pavimento"
                            value="5º andar"
                        >

                        5º andar

                    </label>


                    <label class="pavimento">

                        <input
                            type="checkbox"
                            name="pavimento"
                            value="6º andar"
                        >

                        6º andar

                    </label>


                    <label class="pavimento">

                        <input
                            type="checkbox"
                            name="pavimento"
                            value="7º andar"
                        >

                        7º andar

                    </label>


                    <label class="pavimento">

                        <input
                            type="checkbox"
                            name="pavimento"
                            value="8º andar"
                        >

                        8º andar

                    </label>


                    <label class="pavimento">

                        <input
                            type="checkbox"
                            name="pavimento"
                            value="9º andar"
                        >

                        9º andar

                    </label>


                    <label class="pavimento">

                        <input
                            type="checkbox"
                            name="pavimento"
                            value="10º andar"
                        >

                        10º andar

                    </label>


                    <label class="pavimento">

                        <input
                            type="checkbox"
                            name="pavimento"
                            value="11º andar"
                        >

                        11º andar

                    </label>


                    <label class="pavimento">

                        <input
                            type="checkbox"
                            id="todosPavimentos"
                            name="pavimento"
                            value="TODOS OS PAVIMENTOS"
                        >

                        <strong>

                            TODOS

                        </strong>

                    </label>

                </div>

            </div>


            <!-- =========================================
                 TIPO DE OCORRÊNCIA
            ========================================== -->

            <div class="form-group">

                <label for="ocorrencia">

                    Tipo de Ocorrência:

                </label>

                <select
                    id="ocorrencia"
                    required
                >

                    <option value="">

                        Selecione o serviço

                    </option>

                    <option>
                        Lâmpada/Sensor
                    </option>

                    <option>
                        Limpeza
                    </option>

                    <option>
                        Extintor
                    </option>

                    <option>
                        Imagem/câmera
                    </option>

                    <option>
                        Outros
                    </option>

                </select>

            </div>


            <!-- =========================================
                 DATA/HORÁRIO DA CÂMERA
            ========================================== -->

            <div
                id="areaCamera"
            >

                <div class="form-group">

                    <label for="dataOcorrencia">

                        Data da ocorrência:

                    </label>

                    <input
                        type="date"
                        id="dataOcorrencia"
                    >

                </div>


                <div class="form-group">

                    <label for="horaInicial">

                        Hora inicial:

                    </label>

                    <input
                        type="time"
                        id="horaInicial"
                    >

                </div>


                <div class="form-group">

                    <label for="horaFinal">

                        Hora final:

                    </label>

                    <input
                        type="time"
                        id="horaFinal"
                    >

                </div>

            </div>


            <!-- =========================================
                 FOTO
            ========================================== -->

            <div
                id="areaFoto"
                class="form-group"
            >

                <label>

                    📷 Foto da ocorrência:

                </label>


                <div class="foto-box">

                    <input
                        type="file"
                        id="foto"
                        accept="image/*"
                        capture="environment"
                    >


                    <small>

                        No celular, toque no campo
                        para abrir a câmera ou escolher
                        uma imagem.

                    </small>


                    <img
                        id="previewFoto"
                        alt="Pré-visualização da foto"
                    >

                </div>

            </div>


            <!-- =========================================
                 DETALHES
            ========================================== -->

            <div class="form-group">

                <label for="detalhes">

                    Detalhes do Ocorrido:

                </label>

                <textarea
                    id="detalhes"
                    required
                    placeholder="Descreva brevemente o problema encontrado..."
                ></textarea>

            </div>


            <!-- =========================================
                 ENVIAR
            ========================================== -->

            <button
                type="submit"
                id="btnEnviar"
                class="btn-enviar"
            >

                📋 Enviar Chamado

            </button>


        </form>


        <!-- =============================================
             MENSAGEM
        ============================================== -->

        <div
            id="mensagemSucesso"
            class="mensagem sucesso"
        ></div>


        <div
            id="mensagemErro"
            class="mensagem erro"
        ></div>


        <!-- =============================================
             PROTOCOLO
        ============================================== -->

        <div
            id="protocoloBox"
            class="protocolo-box"
        >

            <div class="protocolo-titulo">

                PROTOCOLO / OS

            </div>


            <div
                id="numeroProtocolo"
                class="protocolo-numero"
            >

            </div>


            <button
                type="button"
                id="btnWhatsApp"
                class="btn-whatsapp"
            >

                💬 Enviar pelo WhatsApp

            </button>

        </div>

    </section>


    <!-- =================================================
         CONSULTAR PROTOCOLO
    ================================================== -->

    <section
        id="secaoConsultar"
        class="section"
    >

        <div class="section-title">

            🔎 Consultar Protocolo / OS

        </div>


        <div class="form-group">

            <label for="consultaProtocolo">

                Número do Protocolo:

            </label>

            <input
                type="text"
                id="consultaProtocolo"
                placeholder="Ex.: PC-13-08-26-001"
            >

        </div>


        <button
            type="button"
            id="btnConsultar"
            class="btn-primary"
        >

            🔎 Consultar Protocolo

        </button>


        <button
            type="button"
            class="btn-voltar"
            onclick="abrirSecao('abrir')"
        >

            ← Voltar para Abrir Chamado

        </button>


        <div
            id="mensagemConsulta"
            class="mensagem erro"
        ></div>


        <div
            id="resultadoConsulta"
            class="resultado"
        >

            <div class="resultado-header">

                📋 Dados do Chamado

            </div>


            <div
                id="dadosConsulta"
                class="resultado-body"
            ></div>

        </div>

    </section>


</div>


<script>


/* =====================================================
   CONFIGURAÇÕES
===================================================== */


/*
 * Formspree
 */

const FORM_ENDPOINT =
    "https://formspree.io/f/mljrnqgv";


/*
 * Netlify Function
 *
 * IMPORTANTE:
 * usamos o endereço oficial da Function.
 */

const API_ENDPOINT =
    "/.netlify/functions/protocolo";


/*
 * WhatsApp
 *
 * Número informado anteriormente:
 * (61) 98603-8106
 */

const WHATSAPP_NUMEROS = [

    "5561986038106"

];


/* =====================================================
   ELEMENTOS
===================================================== */

const form =
    document.getElementById(
        "formChamado"
    );


const bloco =
    document.getElementById(
        "bloco"
    );


const areaPavimentos =
    document.getElementById(
        "areaPavimentos"
    );


const todosPavimentos =
    document.getElementById(
        "todosPavimentos"
    );


const ocorrencia =
    document.getElementById(
        "ocorrencia"
    );


const areaCamera =
    document.getElementById(
        "areaCamera"
    );


const areaFoto =
    document.getElementById(
        "areaFoto"
    );


const foto =
    document.getElementById(
        "foto"
    );


const previewFoto =
    document.getElementById(
        "previewFoto"
    );


const protocoloInput =
    document.getElementById(
        "protocolo"
    );


const btnEnviar =
    document.getElementById(
        "btnEnviar"
    );


const protocoloBox =
    document.getElementById(
        "protocoloBox"
    );


const numeroProtocolo =
    document.getElementById(
        "numeroProtocolo"
    );


/* =====================================================
   ABRIR SEÇÃO
===================================================== */

function abrirSecao(
    secao
) {


    const abrir =
        document.getElementById(
            "secaoAbrir"
        );


    const consultar =
        document.getElementById(
            "secaoConsultar"
        );


    if (
        secao === "abrir"
    ) {

        abrir.classList.add(
            "active"
        );

        consultar.classList.remove(
            "active"
        );

    }

    else {

        abrir.classList.remove(
            "active"
        );

        consultar.classList.add(
            "active"
        );

    }

}


/* =====================================================
   PAVIMENTOS
===================================================== */

bloco.addEventListener(
    "change",
    function () {


        const ehBloco =
            this.value.startsWith(
                "Bloco "
            );


        if (
            ehBloco
        ) {

            areaPavimentos.style.display =
                "block";

        }

        else {

            areaPavimentos.style.display =
                "none";


            document
                .querySelectorAll(
                    'input[name="pavimento"]'
                )
                .forEach(
                    item => {

                        item.checked =
                            false;

                        item.disabled =
                            false;

                    }
                );

        }

    }
);


/* =====================================================
   TODOS OS PAVIMENTOS
===================================================== */

todosPavimentos.addEventListener(
    "change",
    function () {


        const outros =
            document.querySelectorAll(
                'input[name="pavimento"]'
            );


        outros.forEach(
            item => {


                if (
                    item !==
                    todosPavimentos
                ) {

                    item.checked =
                        false;

                    item.disabled =
                        todosPavimentos.checked;

                }

            }
        );

    }
);


/* =====================================================
   OCORRÊNCIA
===================================================== */

ocorrencia.addEventListener(
    "change",
    function () {


        if (
            this.value ===
            "Imagem/câmera"
        ) {


            areaCamera.style.display =
                "block";


            areaFoto.style.display =
                "block";


            document
                .getElementById(
                    "dataOcorrencia"
                )
                .required =
                true;


            document
                .getElementById(
                    "horaInicial"
                )
                .required =
                true;


            document
                .getElementById(
                    "horaFinal"
                )
                .required =
                true;

        }

        else {


            areaCamera.style.display =
                "none";


            areaFoto.style.display =
                "none";


            document
                .getElementById(
                    "dataOcorrencia"
                )
                .required =
                false;


            document
                .getElementById(
                    "horaInicial"
                )
                .required =
                false;


            document
                .getElementById(
                    "horaFinal"
                )
                .required =
                false;


            document
                .getElementById(
                    "dataOcorrencia"
                )
                .value =
                "";


            document
                .getElementById(
                    "horaInicial"
                )
                .value =
                "";


            document
                .getElementById(
                    "horaFinal"
                )
                .value =
                "";


            foto.value =
                "";


            previewFoto.style.display =
                "none";

        }

    }
);


/* =====================================================
   FOTO
===================================================== */

foto.addEventListener(
    "change",
    function () {


        const arquivo =
            this.files[0];


        if (
            !arquivo
        ) {

            previewFoto.style.display =
                "none";

            return;

        }


        if (
            !arquivo.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "Selecione uma imagem."
            );

            this.value =
                "";

            return;

        }


        const leitor =
            new FileReader();


        leitor.onload =
            function (evento) {


                previewFoto.src =
                    evento.target.result;


                previewFoto.style.display =
                    "block";

            };


        leitor.readAsDataURL(
            arquivo
        );

    }
);


/* =====================================================
   PAVIMENTOS SELECIONADOS
===================================================== */

function obterPavimentos() {


    return Array
        .from(
            document.querySelectorAll(
                'input[name="pavimento"]:checked'
            )
        )
        .map(
            item =>
                item.value
        )
        .join(
            ", "
        );

}


/* =====================================================
   DATA
===================================================== */

function formatarData(
    data
) {


    if (
        !data
    ) {

        return "";

    }


    const partes =
        data.split("-");


    if (
        partes.length !== 3
    ) {

        return data;

    }


    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(
    texto
) {


    return texto
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   MOSTRAR ERRO
===================================================== */

function mostrarErro(
    mensagem
) {


    const elemento =
        document.getElementById(
            "mensagemErro"
        );


    elemento.textContent =
        mensagem;


    elemento.style.display =
        "block";

}


/* =====================================================
   LIMPAR MENSAGENS
===================================================== */

function limparMensagens() {


    document
        .getElementById(
            "mensagemErro"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "mensagemSucesso"
        )
        .style.display =
        "none";

}


/* =====================================================
   ENVIO DO CHAMADO
===================================================== */

form.addEventListener(
    "submit",
    async function (event) {


        event.preventDefault();


        limparMensagens();


        btnEnviar.disabled =
            true;


        btnEnviar.textContent =
            "⏳ Gerando protocolo...";


        /*
         * Abre uma janela do WhatsApp
         * a partir da ação do usuário.
         *
         * Isso reduz a possibilidade de
         * bloqueio do navegador.
         */

        let janelaWhatsApp =
            null;


        try {


            /* =========================================
               COLETAR DADOS
            ========================================== */

            const solicitante =
                document
                    .getElementById(
                        "solicitante"
                    )
                    .value
                    .trim();


            const cargo =
                document
                    .getElementById(
                        "cargo"
                    )
                    .value;


            const blocoValor =
                bloco.value;


            const pavimentos =
                obterPavimentos();


            const ocorrenciaValor =
                ocorrencia.value;


            const dataOcorrencia =
                formatarData(
                    document
                        .getElementById(
                            "dataOcorrencia"
                        )
                        .value
                );


            const horaInicial =
                document
                    .getElementById(
                        "horaInicial"
                    )
                    .value;


            const horaFinal =
                document
                    .getElementById(
                        "horaFinal"
                    )
                    .value;


            const detalhes =
                document
                    .getElementById(
                        "detalhes"
                    )
                    .value
                    .trim();


            /* =========================================
               DADOS PARA O NETLIFY
            ========================================== */

            const dadosChamado = {

                solicitante:
                    solicitante,

                cargo:
                    cargo,

                bloco:
                    blocoValor,

                pavimentos:
                    pavimentos,

                ocorrencia:
                    ocorrenciaValor,

                dataOcorrencia:
                    dataOcorrencia,

                horaInicial:
                    horaInicial,

                horaFinal:
                    horaFinal,

                detalhes:
                    detalhes

            };


            /* =========================================
               GERAR PROTOCOLO
            ========================================== */

            const resposta =
                await fetch(
                    API_ENDPOINT,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                dadosChamado
                            )

                    }
                );


            let resultado;


            try {

                resultado =
                    await resposta.json();

            }

            catch {

                throw new Error(
                    "O servidor não retornou uma resposta válida."
                );

            }


            if (
                !resposta.ok ||
                !resultado.protocolo
            ) {

                throw new Error(
                    resultado.erro ||
                    "Não foi possível gerar o protocolo."
                );

            }


            const protocolo =
                resultado.protocolo;


            /* =========================================
               MOSTRAR PROTOCOLO
            ========================================== */

            protocoloInput.value =
                protocolo;


            numeroProtocolo.textContent =
                protocolo;


            protocoloBox.style.display =
                "block";


            /* =========================================
               FORMSPREE
            ========================================== */

            btnEnviar.textContent =
                "📧 Enviando chamado...";


            const formData =
                new FormData();


            formData.append(
                "Protocolo / OS",
                protocolo
            );


            formData.append(
                "Solicitante",
                solicitante
            );


            formData.append(
                "Cargo/Função",
                cargo
            );


            formData.append(
                "Bloco / Área",
                blocoValor
            );


            formData.append(
                "Pavimento(s)",
                pavimentos ||
                "Não se aplica"
            );


            formData.append(
                "Tipo de Ocorrência",
                ocorrenciaValor
            );


            if (
                dataOcorrencia
            ) {

                formData.append(
                    "Data da ocorrência",
                    dataOcorrencia
                );

            }


            if (
                horaInicial
            ) {

                formData.append(
                    "Hora inicial",
                    horaInicial
                );

            }


            if (
                horaFinal
            ) {

                formData.append(
                    "Hora final",
                    horaFinal
                );

            }


            formData.append(
                "Detalhes do Ocorrido",
                detalhes
            );


            /*
             * Foto, se existir.
             */

            if (
                foto.files.length > 0
            ) {

                formData.append(
                    "Foto da ocorrência",
                    foto.files[0]
                );

            }


            formData.append(
                "_subject",
                `Novo Chamado Parque Clube - ${protocolo}`
            );


            const respostaEmail =
                await fetch(
                    FORM_ENDPOINT,
                    {

                        method:
                            "POST",

                        body:
                            formData,

                        headers: {

                            "Accept":
                                "application/json"

                        }

                    }
                );


            /*
             * Mesmo se o Formspree apresentar problema,
             * o protocolo já foi salvo no Netlify.
             */

            if (
                !respostaEmail.ok
            ) {

                console.warn(
                    "O protocolo foi criado, mas o envio para o Formspree apresentou erro."
                );

            }


            /* =========================================
               SUCESSO
            ========================================== */

            const sucesso =
                document
                    .getElementById(
                        "mensagemSucesso"
                    );


            sucesso.innerHTML =
                `
                ✅ Chamado registrado com sucesso!<br>
                Protocolo:
                <strong>${escapeHTML(protocolo)}</strong>
                `;


            sucesso.style.display =
                "block";


            /* =========================================
               CONFIGURAR WHATSAPP
            ========================================== */

            configurarWhatsApp(
                protocolo,
                dadosChamado
            );


            /*
             * Limpa somente os campos de entrada.
             */

            form.reset();


            areaPavimentos.style.display =
                "none";


            areaCamera.style.display =
                "none";


            areaFoto.style.display =
                "none";


            previewFoto.style.display =
                "none";


            /*
             * Mantém o protocolo visível.
             */

            protocoloInput.value =
                protocolo;


            window.scrollTo(
                {
                    top: 0,
                    behavior: "smooth"
                }
            );


        }

        catch (erro) {


            console.error(
                "ERRO:",
                erro
            );


            /*
             * Se alguma janela do WhatsApp
             * foi aberta, fecha.
             */

            if (
                janelaWhatsApp &&
                !janelaWhatsApp.closed
            ) {

                janelaWhatsApp.close();

            }


            mostrarErro(
                erro.message ||
                "Não foi possível gerar o protocolo. Tente novamente."
            );

        }


        finally {

            btnEnviar.disabled =
                false;


            btnEnviar.textContent =
                "📋 Enviar Chamado";

        }

    }
);


/* =====================================================
   WHATSAPP
===================================================== */

function configurarWhatsApp(
    protocolo,
    dados
) {


    let mensagem =
        "";


    mensagem +=
        "🏢 *PARQUE CLUBE*\n";


    mensagem +=
        "*NOVO CHAMADO / OS*\n\n";


    mensagem +=
        `📋 *Protocolo:* ${protocolo}\n\n`;


    mensagem +=
        `👤 *Solicitante:* ${dados.solicitante}\n`;


    mensagem +=
        `💼 *Cargo/Função:* ${dados.cargo}\n`;


    mensagem +=
        `📍 *Bloco/Área:* ${dados.bloco}\n`;


    if (
        dados.pavimentos
    ) {

        mensagem +=
            `🏢 *Pavimento(s):* ${dados.pavimentos}\n`;

    }


    mensagem +=
        `🔧 *Ocorrência:* ${dados.ocorrencia}\n`;


    if (
        dados.dataOcorrencia
    ) {

        mensagem +=
            `📅 *Data da ocorrência:* ${dados.dataOcorrencia}\n`;

    }


    if (
        dados.horaInicial
    ) {

        mensagem +=
            `🕐 *Hora inicial:* ${dados.horaInicial}\n`;

    }


    if (
        dados.horaFinal
    ) {

        mensagem +=
            `🕐 *Hora final:* ${dados.horaFinal}\n`;

    }


    mensagem +=
        `\n📝 *Detalhes:*\n${dados.detalhes}\n`;


    mensagem +=
        "\n🟡 *Status: ABERTO*";


    const numero =
        WHATSAPP_NUMEROS[0];


    const url =
        "https://wa.me/" +
        numero +
        "?text=" +
        encodeURIComponent(
            mensagem
        );


    const botao =
        document.getElementById(
            "btnWhatsApp"
        );


    botao.onclick =
        function () {

            window.open(
                url,
                "_blank"
            );

        };

}


/* =====================================================
   CONSULTAR PROTOCOLO
===================================================== */

document
    .getElementById(
        "btnConsultar"
    )
    .addEventListener(
        "click",
        async function () {


            const campo =
                document.getElementById(
                    "consultaProtocolo"
                );


            const protocolo =
                campo.value
                    .trim()
                    .toUpperCase();


            const mensagem =
                document.getElementById(
                    "mensagemConsulta"
                );


            const resultado =
                document.getElementById(
                    "resultadoConsulta"
                );


            mensagem.style.display =
                "none";


            resultado.style.display =
                "none";


            if (
                !protocolo
            ) {

                mensagem.textContent =
                    "Digite o número do protocolo.";

                mensagem.style.display =
                    "block";

                return;

            }


            const botao =
                document.getElementById(
                    "btnConsultar"
                );


            botao.disabled =
                true;


            botao.textContent =
                "⏳ Consultando...";


            try {


                const resposta =
                    await fetch(

                        API_ENDPOINT +
                        "?protocolo=" +
                        encodeURIComponent(
                            protocolo
                        )

                    );


                let dados;


                try {

                    dados =
                        await resposta.json();

                }

                catch {

                    throw new Error(
                        "O servidor não retornou uma resposta válida."
                    );

                }


                if (
                    !resposta.ok ||
                    !dados.encontrado
                ) {

                    throw new Error(
                        dados.erro ||
                        "Protocolo não encontrado."
                    );

                }


                mostrarConsulta(
                    dados.chamado
                );


            }

            catch (erro) {


                mensagem.textContent =
                    erro.message;


                mensagem.style.display =
                    "block";

            }


            finally {


                botao.disabled =
                    false;


                botao.textContent =
                    "🔎 Consultar Protocolo";

            }

        }
    );


/* =====================================================
   MOSTRAR CONSULTA
===================================================== */

function mostrarConsulta(
    chamado
) {


    const resultado =
        document.getElementById(
            "resultadoConsulta"
        );


    const dados =
        document.getElementById(
            "dadosConsulta"
        );


    let html =
        "";


    html += itemConsulta(
        "Protocolo / OS",
        chamado.protocolo
    );


    html += itemConsulta(
        "Data de abertura",
        chamado.dataAbertura
    );


    html +=
        `
        <div class="resultado-item">

            <strong>Status</strong>

            <span class="status">

                ${escapeHTML(
                    chamado.status ||
                    "Aberto"
                )}

            </span>

        </div>
        `;


    html += itemConsulta(
        "Solicitante",
        chamado.solicitante
    );


    html += itemConsulta(
        "Cargo/Função",
        chamado.cargo
    );


    html += itemConsulta(
        "Bloco / Área",
        chamado.bloco
    );


    html += itemConsulta(
        "Pavimento(s)",
        chamado.pavimentos ||
        "Não se aplica"
    );


    html += itemConsulta(
        "Tipo de Ocorrência",
        chamado.ocorrencia
    );


    if (
        chamado.dataOcorrencia
    ) {

        html += itemConsulta(
            "Data da ocorrência",
            chamado.dataOcorrencia
        );

    }


    if (
        chamado.horaInicial
    ) {

        html += itemConsulta(
            "Hora inicial",
            chamado.horaInicial
        );

    }


    if (
        chamado.horaFinal
    ) {

        html += itemConsulta(
            "Hora final",
            chamado.horaFinal
        );

    }


    html += itemConsulta(
        "Detalhes",
        chamado.detalhes
    );


    dados.innerHTML =
        html;


    resultado.style.display =
        "block";


    resultado.scrollIntoView(
        {
            behavior: "smooth",
            block: "start"
        }
    );

}


/* =====================================================
   ITEM DA CONSULTA
===================================================== */

function itemConsulta(
    titulo,
    valor
) {


    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        valor =
            "Não informado";

    }


    return `
        <div class="resultado-item">

            <strong>
                ${escapeHTML(titulo)}
            </strong>

            <span>
                ${escapeHTML(
                    String(valor)
                )}
            </span>

        </div>
    `;

}
